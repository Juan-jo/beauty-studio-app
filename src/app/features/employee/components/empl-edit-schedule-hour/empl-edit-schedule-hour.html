<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-xs p-4">

    @if(state() === 'idle') {


        <div
        class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-200/80 overflow-hidden animate-in fade-in zoom-in-95 duration-150">

            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
                <div>
                <h3 class="text-base font-bold text-gray-900">Editar Horario</h3>
                <p class="text-xs text-gray-500 font-medium">Configura el horario laboral de la jornada</p>
                </div>

                <button type="button" 
                    (click)="close()"
                class="p-1.5 rounded-xl text-gray-400 hover:text-gray-700 hover:bg-gray-100 transition-all cursor-pointer active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
                </button>
            </div>

            <!-- Body Modal -->
            <form
            [formGroup]="formWorkingHours()"
            (ngSubmit)="saveWorkingHour()">
            
                <div class="p-5 space-y-4">

                <div class="rounded-xl bg-brand-50/80 border border-brand-200/60 p-3.5 flex items-center justify-between">
                    <div>
                    <span class="text-[10px] uppercase font-extrabold text-brand-600 tracking-wider">Jornada Activa</span>
                    <p class="text-sm font-bold text-gray-900">
                        {{day | mxDayOfWeek}}
                    </p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                    <label class="text-xs font-semibold text-gray-700">Hora de Inicio</label>
                    <app-time-picker 
                            formControlName="startTime"
                            [min]="'07:00'" 
                            [max]="'18:00'" 
                            [interval]="30">
                    </app-time-picker>
                    </div>

                    <div class="space-y-1">
                    <label class="text-xs font-semibold text-gray-700">Hora de Fin</label>
                    <app-time-picker 
                        formControlName="endTime"
                        [min]="'12:00'" 
                        [max]="'23:59'" 
                        [interval]="30">
                    </app-time-picker>
                    </div>
                </div>

                </div>

                <div class="flex items-center gap-2.5 px-5 py-3.5 bg-gray-50/50 border-t border-gray-100">
  
                    <button type="button" 
                        [disabled]="isSubmitting"
                        (click)="close()"
                        class="flex-1 flex items-center justify-center py-2.5 px-4 rounded-xl border border-gray-200/80 text-xs font-semibold text-gray-600 hover:bg-gray-100 hover:text-gray-800 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 cursor-pointer">
                        Cancelar
                    </button>
                  
                    <button type="submit" 
                        [disabled]="isSubmitting"
                        class="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl bg-brand-500 hover:bg-brand-600 text-xs font-semibold text-white shadow-xs transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 cursor-pointer">
                        
                        @if (isSubmitting) {
                            <svg class="w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
                              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Guardando...</span>
                        } @else {
                            <span>Guardar Cambios</span>
                        }
                  
                    </button>
                  
                  </div>
            </form>
        </div>


    }
    @else if(state() === 'success') {


        <ui-state-success
            title="¡Horario Actualizado!"
            [message]="'Los cambios para la jornada de <span class=\'font-bold text-gray-700\'>' + (day | mxDayOfWeek) + '</span> se han guardado correctamente.'"
            (close)="close(true)"
            >

        </ui-state-success>


    }
    @else if(state() == 'error') {


        <ui-state-error
            message="No pudimos actualizar el horario. Por favor verifica los datos e inténtalo de nuevo."
            (close)="close()"
            (retry)="retry()"
            >

        </ui-state-error>


    }
    

  </div>
