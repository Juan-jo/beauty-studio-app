<div 
  cdkDrag
  cdkDragLockAxis="y"
  (cdkDragEnded)="onDragEnded($event)"
  [class]="isFullScreen() ? 'h-screen rounded-t-3xl' : 'min-h-[100vh]  max-h-[100vh] rounded-t-3xl'"
  class="flex flex-col bg-slate-50 w-full shadow-2xl transition-all duration-300 ease-out overflow-hidden">

  <div cdkDragHandle class="p-5 pb-3 flex-none bg-white border-b border-gray-100 cursor-grab active:cursor-grabbing">

    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-3"></div>

    <div class="flex items-center justify-between mb-4">
      <div>
        <h3 class="text-lg font-bold text-gray-900 leading-tight">Notificaciones</h3>
        <p class="text-xs text-gray-500 font-medium">Mantente al día con tus citas y avisos</p>
      </div>

     
    </div>
  </div>



  <div class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-4 ">

    <app-notifications-content>
                
        </app-notifications-content>



  </div>

</div>
