
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-brand-200/60 px-4 py-3.5 shadow-xs transition-all">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button type="button" onclick="history.back()"
            class="p-2 rounded-xl border border-gray-200 hover:bg-brand-50 hover:border-brand-200 text-gray-600 hover:text-brand-700 transition-all cursor-pointer active:scale-95 shrink-0"
            title="Volver">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        </button>

        <div class="relative" (click)="updatePicture()">
            @if (user()?.pictureUrl) {


              <img class="w-11 h-11 rounded-full object-cover border border-brand-200 shadow-xs" 
              [src]="user()!.pictureUrl"
              [alt]="user()?.name">

              
    
          }
          @else {
            
            <div
                class="
                  w-11 h-11
                  rounded-full
                  flex
                  items-center
                  justify-center
                  bg-brand-100
                  text-brand-700
                  font-semibold
                "
              >
                {{ userInitials() }}
              </div>
          }


          <div class="
                  absolute inset-0
                  rounded-full
                  bg-black/0
                  group-hover:bg-black/25
                  transition-all
                  flex
                  items-center
                  justify-center
                ">
            <svg class="
                    w-4 h-4
                    text-white
                    opacity-0
                    group-hover:opacity-100
                    transition-opacity
                    drop-shadow
                  " fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.232 5.232l3.536 3.536M4 20h4l10.732-10.732a2.5 2.5 0 00-3.536-3.536L4 16.464V20z" />
            </svg>
          </div>
          
          <!-- Indicador permanente -->
          <span class="
                  absolute
                  -right-1
                  -bottom-1
                  w-5
                  h-5
                  rounded-full
                  bg-brand-600
                  border-2
                  border-white
                  flex
                  items-center
                  justify-center
                  shadow-sm
                ">
            <svg class="w-2.5 h-2.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.232 5.232l3.536 3.536M4 20h4l10.732-10.732a2.5 2.5 0 00-3.536-3.536L4 16.464V20z" />
            </svg>
          </span>

            
          
        </div>
        <div>
          <h2 class="text-base font-bold text-gray-900 leading-tight">{{user()?.name}}</h2>
          <p class="text-xs text-brand-700 font-medium">Perfil</p>

        </div>
      </div>
  
      
    </div>
  </header>
  
<main class="max-w-7xl mx-auto p-8 md:p-6 bg-brand-50/30 min-h-screen">

    <div class="lg:col-span-2 space-y-4">
        <bs-theme></bs-theme>
        <div class="h-2"></div>
        <bs-logout></bs-logout>
    </div>
    
</main>
