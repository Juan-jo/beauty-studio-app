@let service = serviceResource.value();
@let isLoading = serviceResource.isLoading();

<div class="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/60 animate-[fadeIn_0.2s_ease-out]">
  
  <!-- Content Sheet Panel animado de abajo hacia arriba -->
  <div class="relative w-full max-w-lg overflow-hidden rounded-t-3xl bg-white shadow-2xl transition-all h-[95vh] flex flex-col animate-[slideUp_0.3s_ease-out_forwards]">
    
    <!-- Close Button -->
    <button 
      (click)="dialogRef.close()"
      class="absolute top-4 right-4 z-20 flex items-center justify-center w-8 h-8 rounded-full bg-slate-900/40 text-white backdrop-blur-md hover:bg-slate-900/60 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    @if (isLoading) {
      <!-- ================= SKELETON LOADING STATE ================= -->
      <div class="animate-pulse flex flex-col h-full overflow-hidden">
        
        <div class="relative h-72 sm:h-80 w-full shrink-0 bg-slate-200">
          <div class="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent"></div>
        </div>

        <div class="relative -mt-6 flex-1 px-6 pt-2 pb-6 space-y-6 overflow-hidden">
          <div class="space-y-3">
            <div class="h-6 w-24 bg-slate-200 rounded-full"></div>
            <div class="h-8 w-3/4 bg-slate-200 rounded-lg"></div>
          </div>

          <div class="space-y-2">
            <div class="h-3.5 w-20 bg-slate-200 rounded"></div>
            <div class="h-4 w-full bg-slate-200 rounded"></div>
            <div class="h-4 w-full bg-slate-200 rounded"></div>
            <div class="h-4 w-4/5 bg-slate-200 rounded"></div>
          </div>

          <div class="p-5 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-between">
            <div class="space-y-1">
              <div class="h-3 w-24 bg-slate-200 rounded"></div>
              <div class="h-8 w-28 bg-slate-200 rounded-lg"></div>
            </div>
            <div class="h-7 w-20 bg-slate-200 rounded-lg"></div>
          </div>
        </div>

        <div class="p-4 bg-white border-t border-slate-100 mt-auto">
          <div class="h-12 w-full bg-slate-200 rounded-2xl"></div>
        </div>

      </div>
    } @else {
      <!-- ================= CONTENT STATE ================= -->
      
      <div class="relative h-72 sm:h-80 w-full shrink-0 bg-slate-950 overflow-hidden">
        <img 
          [src]="service?.imageUrl" 
          [alt]="service?.name"
          class="h-full w-full object-cover" 
        />
        <div class="absolute inset-0 bg-gradient-to-t from-white via-white/20 to-transparent"></div>
      </div>

      <div class="relative -mt-6 flex-1 overflow-y-auto px-6 pt-2 pb-6 space-y-6">
        
        <div class="space-y-2">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-brand-50 text-brand-700 border border-brand-200/60">
              <span class="text-brand-600">Duración</span>
              {{ service?.durationMinutes | duration }}
            </span>
          </div>

          <h2 class="text-2xl font-bold text-slate-900 tracking-tight leading-snug">
            {{ service?.name }}
          </h2>
        </div>

        <div class="space-y-2">
          <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Descripción</h4>
          <p class="text-sm sm:text-base leading-relaxed text-slate-600 font-normal">
            {{ service?.description }}
          </p>
        </div>

        <div class="p-5 rounded-2xl bg-slate-50 border border-slate-100 flex items-center justify-between">
          <div>
            <span class="block text-xs font-medium text-slate-500 mb-0.5">Precio estimado</span>
            <span class="text-3xl font-black text-slate-900 tracking-tight">
              {{ service?.price ?? 0 | bscurrency }}
            </span>
          </div>

          <div class="text-right">
            <span class="inline-flex items-center gap-1 text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-xl">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
              </svg>
              Disponible
            </span>
          </div>
        </div>

      </div>

      <div class="p-4 bg-white border-t border-slate-100 flex items-center gap-3 mt-auto">
        <button 
          (click)="dialogRef.close(serviceId)"
          class="w-full py-4 px-6 rounded-2xl bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white text-base font-bold shadow-lg shadow-brand-500/25 transition-all flex items-center justify-center gap-2">
          <span>Agendar servicio</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </button>
      </div>

    }

  </div>
</div>
