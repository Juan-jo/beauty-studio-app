<section class="min-h-screen bg-pink-50">

    <div class="mx-auto max-w-7xl px-6 py-10 lg:px-8 lg:py-16">

        <!-- Encabezado -->

        <div class="text-center">

            <span
                class="inline-flex rounded-full bg-pink-100 px-4 py-2 text-sm font-semibold text-pink-600">

                Beauty Studio

            </span>

            <h1
                class="mt-5 text-3xl font-bold text-gray-900 sm:text-4xl lg:text-5xl">

                Nuestros Servicios

            </h1>

            <p
                class="mx-auto mt-4 max-w-xl text-base leading-7 text-gray-500 sm:text-lg">

                Elige el servicio ideal y reserva tu cita en pocos segundos.

            </p>

        </div>

        <!-- Banner PWA -->

        <div class="mt-8">

            <app-install-pwa
                [title]="'No olvides tu cita'"
                [description]="'Instala la aplicación y recibe recordatorios automáticos.'"
                [buttonText]="'Instalar ahora'">
            </app-install-pwa>

        </div>

        <!-- Tarjetas -->

        <div
            class="mt-10 grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">

            @for(service of services; track service.id){

                <article
                    class="overflow-hidden rounded-3xl bg-white shadow-lg transition duration-300 hover:-translate-y-1 hover:shadow-xl">

                    <img
                        [src]="service.image"
                        [alt]="service.name"
                        class="h-52 w-full object-cover sm:h-60 lg:h-72">

                    <div class="p-6">

                        <h2
                            class="text-2xl font-bold text-gray-900">

                            {{ service.name }}

                        </h2>

                        <p
                            class="mt-2 text-gray-500">

                            Duración: {{ service.duration }}

                        </p>

                        <p
                            class="mt-5 text-3xl font-bold text-pink-600">

                            ${{ service.price }}

                        </p>

                        <button
                            class="mt-6 w-full rounded-xl bg-pink-500 py-4 font-semibold text-white transition hover:bg-pink-600 active:scale-95">

                            Reservar cita

                        </button>

                    </div>

                </article>

            }

        </div>

    </div>

</section>
