<div class="relative w-full max-w-33">


  <!-- Input visual -->

  <button
      type="button"
      (click)="toggle()"
      class="
        w-full
        flex
        items-center
        justify-between
        rounded-xl
        border
        border-gray-200
        bg-white
        px-4
        py-3
        text-sm
        font-bold
        text-gray-800
        hover:border-brand-400
        transition-all
      ">


      <span>
          {{ value }} 
      </span>


      <svg
          class="w-5 h-5 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />

      </svg>


  </button>



  <!-- Dropdown -->
  @if(open) {

    <div
    class="
      fixed
      z-[9999]
      max-w-36
      max-h-64
      overflow-y-auto
      rounded-2xl
      bg-white
      border
      border-gray-100
      shadow-xl
      p-2
    "
    [ngStyle]="dropdownStyle">
    
    
    @for(time of times; track time) {
    
    <button
      type="button"
      (click)="select(time)"
      class="
        w-full
        rounded-xl
        px-4
        py-2
        text-left
        text-sm
        font-semibold
        hover:bg-brand-50
        hover:text-brand-600
      "
      [class.bg-brand-50]="time === value"
      [class.text-brand-600]="time === value"
    >
    
    {{time}}
    
    </button>
    
    }
    
    
    </div>
    
    } 

</div>
