<div class="flex flex-col bg-white w-full max-w-lg mx-auto rounded-3xl shadow-2xl min-h-[500px] max-h-[85vh] border border-slate-100 overflow-hidden transition-all duration-300">
  
    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between flex-none bg-slate-50/50">
      <div class="flex flex-col">
        <h3 class="text-lg font-bold text-slate-900 tracking-tight">
          Foto de perfil
        </h3>
        <p class="text-xs text-slate-500 mt-0.5">
          Selecciona o sube una imagen para personalizar tu cuenta
        </p>
      </div>
  
      <button 
        type="button"
        (click)="close()" 
        class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-2 rounded-full transition-colors cursor-pointer"
        aria-label="Cerrar modal">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  
    @if(state() === 'idle') {

        <div class="p-8 flex-1 overflow-y-auto flex flex-col items-center justify-center">
        
            <div class="w-full max-w-xs flex flex-col items-center">
            <app-image-picker
                mode="avatar"
                (imageSelected)="selectPicture($event)"
                (cropping)="cropping($event)">
            </app-image-picker>
            </div>
        
        </div>
        
        <!--Accciones-->
        @if(!isCropping()) {
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50 flex items-center justify-end gap-3 flex-none">
                <button 
                    type="button"
                    (click)="close()" 
                    class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-white hover:border-slate-300 text-sm font-semibold transition-all active:scale-95 cursor-pointer shadow-xs">
                    Cancelar
                </button>
                
                <button 
                    [disabled]="!image()"
                
                    type="button"
                    (click)="save()"
                    class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-sm font-semibold transition-all
                        bg-brand-600 hover:bg-brand-700 text-white cursor-pointer active:scale-95 shadow-md shadow-brand-600/20
                        disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none 
                        disabled:cursor-not-allowed disabled:active:scale-100">
                    Guardar foto
                </button>
                </div>
        }

    }
    @else if(state() === 'error') {

        <div class="p-8 flex-1 overflow-y-auto flex flex-col items-center justify-center">
        
            <div class="w-full max-w-xs flex flex-col items-center">
                <ui-state-error
                [message]="errorMessage"
                (retry)="retry()"
                (close)="close()">
                </ui-state-error>
            </div>
        
        </div>

       
    }
    @else if(state() === 'success') {

        <div class="p-8 flex-1 overflow-y-auto flex flex-col items-center justify-center">
        
            <div class="w-full max-w-xs flex flex-col items-center">
                <ui-state-success
                message="Foto cargada correctamente"
                title="Exito"
                (close)="close()">
                </ui-state-success>
            </div>
        
        </div>
        
       
    }
    @else if(state() === 'loading') {

        <div class="flex flex-col items-center justify-center p-8 text-center space-y-4 my-auto">
          <!-- Spinner de carga circular -->
          <div class="relative flex items-center justify-center">
            <!-- Círculo base tenue -->
            <div class="w-16 h-16 rounded-full border-4 border-slate-100"></div>
            <!-- Círculo giratorio animado -->
            <div class="absolute w-16 h-16 rounded-full border-4 border-brand-600 border-t-transparent animate-spin"></div>
            <!-- Esqueleto central del avatar -->
            <div class="absolute w-10 h-10 rounded-full bg-slate-200 animate-pulse"></div>
          </div>

          <!-- Textos de estado -->
          <div class="space-y-1">
            <p class="text-sm font-semibold text-slate-800 animate-pulse">
              Subiendo foto de perfil...
            </p>
            <p class="text-xs text-slate-400">
              Por favor espera un momento
            </p>
          </div>
        </div>

    }


    
    
  
  </div>
