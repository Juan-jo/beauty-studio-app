<div class="relative w-full ">

    <button type="button" (click)="toggle()" class="
          w-full
          flex
          items-center
          justify-between
          rounded-xl
          border
          border-gray-200
          bg-white
          px-4
          py-3
          text-sm
          font-bold
          text-gray-800
          hover:border-brand-400
          transition-all
        ">


        <span>
            {{ value | duration }}
        </span>




    </button>



    <!-- Dropdown -->
    @if(open) {

    <div class="
        fixed
        z-[9999]
        max-w-36
        max-h-64
        overflow-y-auto
        rounded-2xl
        bg-white
        border
        border-gray-100
        shadow-xl
        p-2
      " [ngStyle]="dropdownStyle">


        @for(time of times; track time) {

        <button type="button" (click)="select(time)" class="
          w-full
          rounded-xl
          px-4
          py-2
          text-left
          text-sm
          font-semibold
          hover:bg-brand-50
          hover:text-brand-600
        " [class.bg-brand-50]="time === value" [class.text-brand-600]="time === value">

            {{time | duration}}

        </button>

        }


    </div>

    }

</div>
