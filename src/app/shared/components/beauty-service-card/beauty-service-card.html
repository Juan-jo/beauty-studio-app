<article 
  (click)="closeModal.emit()" 
  [routerLink]="navigation" 
  [queryParams]="{services: service.id}"
  class="relative flex flex-col justify-end h-full aspect-[3/4] overflow-hidden rounded-3xl bg-gray-950  shadow-md hover:shadow-2xl hover:border-white/40 transition-all duration-500 group cursor-pointer">

  <img [src]="service.pictureUrl" [alt]="service.name" loading="lazy"
    class="absolute inset-0 h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110 group-hover:brightness-105">

  <div
    class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-black/10 transition-opacity duration-300 group-hover:opacity-95">
  </div>

  <div class="relative z-10 p-4 flex flex-col gap-2">

    <h3
      class="text-sm font-bold text-white leading-snug line-clamp-2 drop-shadow-xs group-hover:text-brand-300 transition-colors">
      {{ service.name }}
    </h3>

    <div class="flex items-center justify-between gap-2 pt-1">

      <span class="text-base font-extrabold text-white tracking-tight drop-shadow-xs">
        {{ service.price | bscurrency }}
      </span>

      <div
        class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-white/10 group-hover:bg-white/25 backdrop-blur-md text-white border border-white/20 transition-all duration-300 group-active:scale-90">
        <svg class="w-3.5 h-3.5 transition-transform duration-300 group-hover:translate-x-0.5" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </div>

    </div>

  </div>

</article>
