<div class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-gray-200/80 p-6 flex flex-col items-center text-center animate-in fade-in zoom-in-95 duration-150">
    <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mb-4 ring-8 ring-rose-50/50">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
    </div>

    <h3 class="text-base font-bold text-gray-900">Ocurrió un error</h3>
    <p class="text-xs text-gray-500 font-medium mt-1 leading-relaxed">
        {{message}}
    </p>

    <div class="flex gap-2.5 w-full mt-6">
        <button type="button" 
            (click)="close.emit()"
            class="flex-1 py-2.5 px-3 rounded-xl border border-gray-200 text-xs font-semibold text-gray-600 hover:bg-gray-50 transition-all cursor-pointer">
            Cancelar
        </button>

        <button type="button" 
            (click)="retry.emit()"
            class="flex-1 py-2.5 px-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow-xs transition-all cursor-pointer active:scale-95">
            Reintentar
        </button>
    </div>
</div>
