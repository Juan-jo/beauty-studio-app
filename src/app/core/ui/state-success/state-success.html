<div class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-gray-200/80 p-6 flex flex-col items-center text-center animate-in fade-in zoom-in-95 duration-150">
    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-4 ring-8 ring-emerald-50/50">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
    </div>

    <h3 class="text-base font-bold text-gray-900">
        {{title}}
    </h3>
    <p class="text-xs text-gray-500 font-medium mt-1 leading-relaxed"
        [innerHTML]="safeMessage">
    </p>

    <button type="button" 
        (click)="close.emit()"
        class="mt-6 w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-xs transition-all cursor-pointer active:scale-95">
        Aceptar
    </button>
</div>
