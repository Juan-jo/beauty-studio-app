<div class="flex flex-col bg-slate-50 text-slate-800">



  <header class="sticky top-0 z-50 w-full border-b border-brand-100/60 bg-white/80 backdrop-blur-md transition-all duration-300">
    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-8">
      
      <div class="flex items-center gap-3">
        
        @if (showBackButton()) {
          <button type="button" 
          (click)="goBack()"
          class="p-2 rounded-xl border border-gray-200/80 hover:bg-brand-50 hover:border-brand-200 text-gray-600 hover:text-brand-700 transition-all cursor-pointer active:scale-95 shrink-0"
          title="Volver">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>

          <div class="h-5 w-px bg-brand-200/40"></div>
        }
  
        <div  class="group flex items-center gap-3 focus:outline-none">
          <div class="relative flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-full ring-2 ring-brand-200/60 transition-transform duration-300 group-hover:scale-105">
            <img 
              [src]="config.logo" 
              [alt]="config.salonName" 
              class="h-full w-full object-cover" />
          </div>
          
          <div class="flex flex-col">
            <span class="font-serif text-lg font-bold tracking-tight text-slate-900 sm:text-xl">
              {{ config.salonName }}
            </span>
            <span class="text-[10px] font-semibold tracking-widest uppercase text-brand-500/90 -mt-1">
              {{ 'Nail Art & Estética' }}
            </span>
          </div>
        </div>
  
      </div>

      </nav>

          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-6 w-6">

    </div>
  
    @if (isMobileMenuOpen()) {
      <div class="border-b border-brand-100 bg-white/95 px-6 py-6 backdrop-blur-xl md:hidden animate-in fade-in slide-in-from-top-4 duration-200">
        <nav class="flex flex-col gap-4">
          <a 
            routerLink="/servicios" 
            class="text-base font-medium text-slate-800 hover:text-brand-600 transition">
            Explorar
          </a>
          
          <a 
            routerLink="/nosotros" 
            class="text-base font-medium text-slate-800 hover:text-brand-600 transition">

        </nav>

  <main class="flex-1">
    <router-outlet />
