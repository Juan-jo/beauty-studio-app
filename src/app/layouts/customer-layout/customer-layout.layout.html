<div class="min-h-screen bg-brand-50/30 text-gray-800 flex flex-col pb-16 md:pb-0">

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3.5 flex justify-between items-center transition-all">
  
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white font-bold text-sm shadow-xs shrink-0">
            B
          </div>
      
          <div class="flex flex-col min-w-0">
            <span class="font-bold text-xs text-gray-900 tracking-tight leading-none mb-1">
              Beauty Studio
            </span>
            
            <p class="text-[11px] text-gray-400 font-medium truncate leading-none">
              Hola, <span class="text-gray-700 font-semibold">{{ 'Alexa' }}</span>
            </p>
          </div>
        </div>
      
        <div class="flex items-center gap-1.5">
          
          <button 
            type="button"
            class="relative p-2 rounded-xl text-gray-500 hover:text-gray-800 hover:bg-gray-100/80 transition-all cursor-pointer active:scale-95">
            
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
     
            
            <span class="absolute top-1.5 right-1.5 flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500 border-2 border-white"></span>
              </span>
           
          </button>
      
          <button 
            type="button"
            
            class="ml-1 flex items-center justify-center h-8 w-8 rounded-full border border-gray-200/80 bg-gray-50 overflow-hidden cursor-pointer active:scale-95 transition-all">
            
            <img [src]="'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=150'" [alt]="'as'" class="w-full h-full object-cover">
            
          </button>
      
        </div>
      
      </header>
    
    <main class="flex-1  max-w-7xl w-full mx-auto  bg-brand-50/30">
      <router-outlet />
    </main>
  
    <nav
      class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-brand-200/60 py-2 px-4 flex justify-around items-center z-40 shadow-xs md:relative md:border-t-0 md:bg-transparent md:justify-start md:gap-2 md:shadow-none">
  

      <a routerLink="/customer/feed" routerLinkActive="text-brand-700 font-semibold bg-brand-100/70"
        class="flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 px-3.5 rounded-lg text-[13px] text-gray-500 hover:text-brand-700 hover:bg-brand-50 transition-all">
  
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span>Feed</span>
      </a>

  
      
  
      <a routerLink="/customer/profile" routerLinkActive="text-brand-700 font-semibold bg-brand-50/80"
        class="flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 px-3.5 rounded-lg text-[13px] text-gray-500 hover:text-brand-700 hover:bg-brand-50 transition-all">
  

        <div class="relative">
          <img class="w-6 h-6 rounded-full object-cover border border-brand-200 shadow-xs" src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=150" alt="Valeria Morales">
          
        </div>
        <span>Perfil</span>
      </a>
  
    </nav>
  
  </div>
