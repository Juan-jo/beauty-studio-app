<div class="min-h-screen bg-brand-50/30 text-gray-800 flex flex-col pb-16 md:pb-0">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between transition-all">

    <!-- Brand & User Info -->
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center text-white font-bold text-sm shadow-xs shrink-0 select-none">
        B
      </div>
  
      <div class="flex flex-col min-w-0 justify-center">
        <span class="font-bold text-xs text-gray-900 tracking-tight truncate leading-tight">
          Beauty Studio
        </span>
        <p class="text-[11px] text-gray-400 font-medium truncate leading-tight">
          Hola, <span class="text-gray-700 font-semibold">{{ user()?.name }}</span>
        </p>
      </div>
    </div>
  
    <!-- Actions & Profile -->
    <div class="flex items-center gap-1">
  
      <!-- Bookings Dialog Button -->
      <button 
        type="button"
        (click)="openDialogBookings()"
        aria-label="Ver reservas"
        class="relative p-2 rounded-xl text-gray-500 hover:text-gray-800 hover:bg-gray-100/80 active:scale-95 transition-all cursor-pointer focus-visible:outline-2 focus-visible:outline-brand-500">
        
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        
        @if (customerBookingService.hasActive()) {
          <span class="absolute top-2 right-2 flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
        }
      </button>
  
     <!-- Notifications Button -->
<button 
type="button"
aria-label="Ver notificaciones"
class="relative p-2.5 rounded-xl text-gray-500 hover:text-gray-800 hover:bg-gray-100/80 active:scale-95 transition-all cursor-pointer focus-visible:outline-2 focus-visible:outline-brand-500">

<svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
</svg>

@if (notificationService.hasUnread()) {
  <span class="absolute top-1 right-1 translate-x-1/4 -translate-y-1/4 min-w-[18px] h-[18px] px-1 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white leading-none shadow-xs pointer-events-none">
    {{ notificationService.unreadCount() > 9 ? '9+' : notificationService.unreadCount() }}
  </span>
}
</button>
  
      <!-- Profile Avatar Button -->
      <button
        type="button"
        (click)="uploadPicture()"
        aria-label="Cambiar foto de perfil"
        class="relative ml-1 p-0.5 rounded-full hover:ring-2 hover:ring-brand-400/50 active:scale-95 transition-all cursor-pointer focus-visible:outline-2 focus-visible:outline-brand-500">
  
        @if (user()?.pictureUrl) {
          <img class="w-8 h-8 rounded-full object-cover border border-gray-200 shadow-xs" 
               [src]="user()!.pictureUrl"
               [alt]="user()?.name">
        } @else {
          <div class="w-8 h-8 rounded-full flex items-center justify-center bg-brand-100 text-brand-700 font-semibold text-xs border border-brand-200">
            {{ userInitials() }}
          </div>
        }
      </button>
  
    </div>
  </header>

  <main class="flex-1  max-w-7xl w-full mx-auto  bg-brand-50/30 ">
    <router-outlet />
  </main>

  <!--Nagevacion-->
  <nav
    class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-brand-200/60 py-2 px-4 flex justify-around items-center z-40 shadow-xs md:relative md:border-t-0 md:bg-transparent md:justify-start md:gap-2 md:shadow-none">



    <a routerLink="/customer/feed" routerLinkActive="text-brand-700 font-semibold bg-brand-100/70"
      class="flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 px-3.5 rounded-lg text-[13px] text-gray-500 hover:text-brand-700 hover:bg-brand-50 transition-all">

      <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
      </svg>

      <span>Servicios</span>
    </a>




    <a routerLink="/customer/profile" routerLinkActive="text-brand-700 font-semibold bg-brand-50/80"
      class="flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 px-3.5 rounded-lg text-[13px] text-gray-500 hover:text-brand-700 hover:bg-brand-50 transition-all">


      @if (user()?.pictureUrl) {

              
        <div class="relative">
          <img class="w-6 h-6 rounded-full object-cover border border-brand-200 shadow-xs" 
                [src]="user()!.pictureUrl"
                [alt]="user()?.name">
        </div>

      }
      @else {

        <div
            class="
              relative
              w-6 h-6
              rounded-full
              flex
              items-center
              justify-center
              bg-brand-100
              text-brand-700
              font-semibold
            "
          >
            {{ userInitials() }}
        </div>
      }

      <span>Perfil</span>
    </a>

  </nav>

</div>
