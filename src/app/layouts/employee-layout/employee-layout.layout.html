<div class="min-h-screen bg-brand-50/30 text-gray-800 flex flex-col pb-16 md:pb-0">

  <main class="flex-1  max-w-7xl w-full mx-auto  bg-brand-50/30">
    <router-outlet />
  </main>

  <!-- NAVBAR INFERIOR / LATERAL -->
  <nav
    class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-md border-t border-brand-200/60 py-2 px-4 flex justify-around items-center z-40 shadow-xs md:relative md:border-t-0 md:bg-transparent md:justify-start md:gap-2 md:shadow-none">

    <!-- ITEM 1: AGENDA -->
    <a routerLink="/employee/agenda" routerLinkActive="text-brand-700 font-semibold bg-brand-100/70"
      class="flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 px-3.5 rounded-lg text-[13px] text-gray-500 hover:text-brand-700 hover:bg-brand-50 transition-all">

      <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>Agenda</span>
    </a>



    <a routerLink="/employee/notifications" routerLinkActive="text-brand-700 font-semibold bg-brand-50/80"
      class="relative flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 px-3.5 rounded-lg text-[13px] text-gray-500 hover:text-brand-700 hover:bg-brand-50 transition-all">
    
      <!-- Icono con punto de notificación sin leer -->
      <div class="relative">
        <svg class="w-5 h-5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 01-6 0v-1m6 0H9" />
        </svg>
        
        <!--@if (notificationService.hasUnread()) {
          <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-white animate-pulse"></span>
        }-->

        @if (notificationService.hasUnread()) {
          <span class="absolute -top-1.5 -right-2.5 min-w-[18px] h-[18px] px-1 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white leading-none shadow-xs">
            {{ notificationService.unreadCount() > 9 ? '9+' : notificationService.unreadCount() }}
          </span>
        }
        

      </div>
      
      <span>Notificaciones</span>
    </a>

    <a routerLink="/employee/profile" routerLinkActive="text-brand-700 font-semibold bg-brand-50/80"
      class="flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 px-3.5 rounded-lg text-[13px] text-gray-500 hover:text-brand-700 hover:bg-brand-50 transition-all">

      @if (user()?.pictureUrl) {

        
          <div class="relative">
            <img class="w-6 h-6 rounded-full object-cover border border-brand-200 shadow-xs" 
                  [src]="user()!.pictureUrl"
                  [alt]="user()?.name">
          </div>

      }
      @else {
        
        <div
            class="
              relative
              w-6 h-6
              rounded-full
              flex
              items-center
              justify-center
              bg-brand-100
              text-brand-700
              font-semibold
            "
          >
            {{ userInitials() }}
          </div>
      }


      
      <span>Perfil</span>
    </a>

  </nav>

</div>
